name: Repository gates

# Every gate `make test` runs, so none of them depends on a pre-push hook to
# be reached. It runs no validation pass: that scaffolds SDK projects from npm
# and GitHub, which is a job for a manual run.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Syntax-check the driver
        run: bash -n bin/validate-sdkgen
      - name: Run the repository gates
        run: make test
